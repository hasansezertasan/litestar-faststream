---
name: Copilot setup steps
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
permissions: {}
jobs:
  # GitHub Copilot coding agent requires this exact job ID.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # mise installs pipx-backed tools (cobo 0.6.0 needs Python >=3.14), and
      # the pipx backend builds its venv with the runner's system Python
      # unless told otherwise. Point it at the 3.14 from the step above.
      # Mirrors the setup-python-first ordering in ci.yml.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Point pipx at Python 3.14
        run: echo "PIPX_DEFAULT_PYTHON=$(which python)" >> "$GITHUB_ENV"
      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Sync dependencies
        run: uv sync
