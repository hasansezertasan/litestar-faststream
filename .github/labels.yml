# Declarative label set for this repository, synced by
# .github/workflows/label-sync.yml when this file changes on the default branch
# (or via a manual workflow_dispatch run). Edit a label here (name, color,
# description) and the next sync applies it; the sync
# never deletes labels that are absent from this file (skip-delete is enabled),
# so GitHub's defaults and labels created by other automation are left alone.
- name: no-issue
  color: ededed
  # Apply to a pull request to bypass the "Check Linked Issues" workflow when the
  # change legitimately has no associated issue (e.g. a chore or dependency bump).
  description: PR intentionally has no linked issue
- name: release
  color: 0e8a16
  description: Automated release pull request
- name: answered
  color: 1a7f37
  # Consumed by .github/workflows/issue-manager.yml: applying this label starts
  # the reminder and auto-close flow for an issue that has been answered.
  description: Issue has been answered; auto-close timer running
